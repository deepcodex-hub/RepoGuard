<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoGuard Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 3rem 0; margin-bottom: 2rem; border-radius: 0 0 20px 20px; }
        .card-stat { border-left: 5px solid; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        .border-critical { border-color: #dc3545; }
        .border-high { border-color: #fd7e14; }
        .border-medium { border-color: #ffc107; }
        .border-low { border-color: #198754; }
        .text-critical { color: #dc3545; font-weight: bold;}
        .text-high { color: #fd7e14; font-weight: bold;}
        .text-medium { color: #ffc107; font-weight: bold;}
        .text-low { color: #198754; font-weight: bold;}
        #loader { display: none; }
        #resultsArea { display: none; }
        pre { background: #212529; color: #f8f9fa; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="hero text-center shadow">
        <h1 class="display-4 fw-bold"><i class="fa-solid fa-shield-halved"></i> RepoGuard</h1>
        <p class="lead">Your First Line of Defense Against Code Vulnerabilities</p>
        <a href="/swagger-ui/index.html" class="btn btn-outline-light mt-2" target="_blank">
            <i class="fa-solid fa-code"></i> Open Swagger API
        </a>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center mb-5">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Scan a Repository</h5>
                    <form id="scanForm">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-brands fa-github"></i></span>
                            <input type="url" id="repoUrl" class="form-control form-control-lg" placeholder="https://github.com/username/repo" required>
                            <button class="btn btn-primary btn-lg" type="submit" id="scanBtn">
                                <i class="fa-solid fa-magnifying-glass"></i> Scan Now
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="text-center mb-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h4 class="mt-3 text-muted">Scanning repository... This may take a moment.</h4>
    </div>

    <!-- Results Area -->
    <div id="resultsArea">
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card card-stat border-critical shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="text-muted text-uppercase">Critical</h6>
                        <h2 class="display-5 text-critical" id="countCritical">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat border-high shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="text-muted text-uppercase">High</h6>
                        <h2 class="display-5 text-high" id="countHigh">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat border-medium shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="text-muted text-uppercase">Medium</h6>
                        <h2 class="display-5 text-medium" id="countMedium">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat border-low shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="text-muted text-uppercase">Low</h6>
                        <h2 class="display-5 text-low" id="countLow">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow mb-5">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fa-solid fa-list-check"></i> Vulnerability Report</h5>
                <span class="badge bg-primary rounded-pill" id="totalIssuesBadge">0 Issues Found</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Severity</th>
                                <th>Type</th>
                                <th>File (Line)</th>
                                <th>Description</th>
                                <th>Fix Recommendation</th>
                            </tr>
                        </thead>
                        <tbody id="issuesTableBody">
                            <!-- Rows will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('scanForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const url = document.getElementById('repoUrl').value;
        const scanBtn = document.getElementById('scanBtn');
        const loader = document.getElementById('loader');
        const resultsArea = document.getElementById('resultsArea');
        
        // UI State
        scanBtn.disabled = true;
        resultsArea.style.display = 'none';
        loader.style.display = 'block';

        fetch(`/api/scan?repoUrl=${encodeURIComponent(url)}`, {
            method: 'POST'
        })
        .then(response => {
            if(!response.ok) throw new Error('Scan failed. Please check the URL.');
            return response.json();
        })
        .then(data => {
            // Update Summary
            document.getElementById('countCritical').textContent = data.severitySummary.CRITICAL || 0;
            document.getElementById('countHigh').textContent = data.severitySummary.HIGH || 0;
            document.getElementById('countMedium').textContent = data.severitySummary.MEDIUM || 0;
            document.getElementById('countLow').textContent = data.severitySummary.LOW || 0;
            document.getElementById('totalIssuesBadge').textContent = `${data.totalIssues} Issues Found`;

            // Populate Table
            const tbody = document.getElementById('issuesTableBody');
            tbody.innerHTML = '';
            
            if(data.issues.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-success"><i class="fa-solid fa-check-circle fs-2 mb-2"></i><br>No vulnerabilities found!</td></tr>';
            } else {
                data.issues.forEach(issue => {
                    let sevClass = '';
                    if(issue.severity === 'CRITICAL') sevClass = 'text-critical';
                    else if(issue.severity === 'HIGH') sevClass = 'text-high';
                    else if(issue.severity === 'MEDIUM') sevClass = 'text-medium';
                    else sevClass = 'text-low';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="${sevClass}"><i class="fa-solid fa-circle-exclamation"></i> ${issue.severity}</td>
                        <td><span class="badge bg-secondary">${issue.type}</span></td>
                        <td><code>${issue.fileName}:${issue.lineNumber}</code></td>
                        <td>${issue.description}</td>
                        <td><em>${issue.fix}</em></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            loader.style.display = 'none';
            resultsArea.style.display = 'block';
            scanBtn.disabled = false;
        })
        .catch(err => {
            alert(err.message);
            loader.style.display = 'none';
            scanBtn.disabled = false;
        });
    });
</script>
</body>
</html>
